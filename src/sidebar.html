<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Music</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <section id="needs-permission" hidden>
      <p>Firefox needs your OK before this sidebar can control YouTube Music.</p>
      <button id="grant">Allow access to YouTube Music</button>
    </section>

    <section id="signed-out" hidden>
      <p>You're signed out of YouTube Music, so your playlists, library and likes aren't available.</p>
      <button id="sign-in">Sign in</button>
      <button id="signed-in-retry">I've signed in</button>
    </section>

    <section id="now-playing">
      <img id="artwork" alt="" hidden />
      <div class="meta">
        <div id="title">Nothing playing</div>
        <div id="artist">Pick a playlist below</div>
      </div>
      <button id="show-player" class="icon" title="Open the player tab (full YouTube Music)">↗</button>
    </section>

    <section id="transport">
      <div class="progress">
        <span id="time">0:00</span>
        <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek" />
        <span id="duration">0:00</span>
      </div>
      <div class="buttons">
        <button data-action="previous" class="icon" title="Previous">⏮</button>
        <button data-action="toggle" class="icon big" id="toggle" title="Play/pause">▶</button>
        <button data-action="next" class="icon" title="Next">⏭</button>
        <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume" />
      </div>
      <div class="buttons extras">
        <button data-action="like" id="like" class="icon" title="Like">👍</button>
        <button data-action="dislike" id="dislike" class="icon" title="Dislike">👎</button>
        <button data-action="shuffle" class="icon on" title="Shuffle the queue">🔀</button>
        <button data-action="repeat" id="repeat" class="icon" title="Repeat: off">🔁</button>
        <button id="radio" class="icon on" title="Start radio from this song">📻</button>
        <button id="notify" class="icon" title="Notify on song change: off">🔔</button>
      </div>
    </section>

    <form id="search-form">
      <input id="search" type="search" placeholder="Search songs…" autocomplete="off" />
    </form>

    <nav id="tabs">
      <button data-view="home">Home</button>
      <button data-view="playlists" class="active">Playlists</button>
      <button data-view="library">Library</button>
      <button data-view="queue">Queue</button>
      <button data-view="lyrics">Lyrics</button>
      <button data-view="results" hidden>Results</button>
    </nav>

    <nav id="library-sections" hidden>
      <button data-section="albums" class="active">Albums</button>
      <button data-section="artists">Artists</button>
      <button data-section="songs">Songs</button>
    </nav>

    <main id="list"></main>
    <p id="status"></p>

    <script src="common.js"></script>
    <script src="sidebar.js"></script>
  </body>
</html>
